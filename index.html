<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Игра-тренажёр по пропсам в React: 18 пещер, хозяева-чудища, теория со схемами и повторение." />
    <meta name="theme-color" content="#0a080d" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Установка на телефон и работа без интернета (PWA) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Props" />
    <title>Props — Пещеры Графа Пропсулы</title>
    <script>
      // Тему ставим ДО загрузки приложения: иначе при дневной теме страница
      // на мгновение мигала бы тёмной. Ключ тот же, что в src/utils/storage.js.
      try {
        var saved = JSON.parse(localStorage.getItem('props-castle/progress/v1') || '{}');
        if (saved.theme === 'day') {
          document.documentElement.dataset.theme = 'day';
          document.querySelector('meta[name="theme-color"]').content = '#f5efe4';
        }
      } catch (error) {
        // хранилище недоступно (приватный режим) — остаётся ночная тема
      }
    </script>
  </head>
  <body>
    <!-- Сюда React «монтирует» всё приложение (см. src/main.jsx) -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
